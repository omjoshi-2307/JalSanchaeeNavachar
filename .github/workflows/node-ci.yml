name: Node.js CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "eslint.config.*"
      - ".github/workflows/node-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "postcss.config.*"
      - "tailwind.config.*"
      - "eslint.config.*"
      - ".github/workflows/node-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
      - name: Lint source
        run: npm run lint
      - name: Build frontend
        run: npm run build
