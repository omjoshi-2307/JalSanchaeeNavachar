<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        /* Background Layer */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            /* Full Visibility for Lively Effect */
            opacity: 1;
            /* Ken Burns Effect */
            animation: zoomPan 20s infinite alternate ease-in-out;
        }

        /* Overlay to ensure text readability on busy backgrounds */
        #bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            /* Slight dark tint for contrast */
            backdrop-filter: blur(0px);
            /* Keep it crisp */
        }

        @keyframes zoomPan {
            0% {
                transform: scale(1) translate(0, 0);
            }

            100% {
                transform: scale(1.15) translate(-2%, -2%);
            }
        }

        .slide-container {
            position: relative;
            z-index: 1;
            width: 60%;
            max-width: 500px;
            max-width: 500px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);

            /* Seamless Transparent Card */
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 24px;

            /* Enhanced Blue Borders */
            border: 4px solid #0284c7;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), inset 0 0 0 2px rgba(255, 255, 255, 0.5);

            width: 100%;
            box-sizing: border-box;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        h1 {
            background: linear-gradient(135deg, #0511fa 0%, #0369a1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 800;
        }

        p {
            color: #FFFFFF;
            font-size: 1.6rem;
            line-height: 1.5;
            font-weight: 500;
        }

        .icon-container {
            font-size: 7rem;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .corner-decoration {
            position: absolute;
            width: 60px;
            height: 60px;
            border-top: 6px solid #0284c7;
            border-left: 6px solid #0284c7;
            top: -6px;
            left: -6px;
            border-radius: 16px 0 0 0;
        }

        .corner-decoration.bottom {
            top: auto;
            left: auto;
            bottom: -6px;
            right: -6px;
            transform: rotate(180deg);
        }
    </style>
</head>

<body>

    <div id="bg-layer"></div>

    <div class="slide-container">

        <!-- Slide 1 -->
        <div class="slide" id="slide1">
            <div class="corner-decoration"></div>
            <div class="corner-decoration bottom"></div>
            <div class="icon-container" style="color: #8d6e63;">
                <ion-icon name="map"></ion-icon>
            </div>
            <h1>Smart Planning</h1>
            <p>Analyzing village data to create the perfect watering schedule.</p>
        </div>

        <!-- Slide 2 -->
        <div class="slide" id="slide2">
            <div class="corner-decoration"></div>
            <div class="corner-decoration bottom"></div>
            <div class="icon-container" style="color: #2e7d32;">
                <ion-icon name="leaf"></ion-icon>
            </div>
            <h1>Crop Methods</h1>
            <p>Recommending the best irrigation technique for every crop type.</p>
        </div>

        <!-- Slide 3 -->
        <div class="slide" id="slide3">
            <div class="corner-decoration"></div>
            <div class="corner-decoration bottom"></div>
            <div class="icon-container" style="color: #0284c7;">
                <ion-icon name="water"></ion-icon>
            </div>
            <h1>Save Water</h1>
            <p>Practical strategies to minimize wastage and improve efficiency.</p>
        </div>
    </div>

    <script>
        const slides = [
            document.getElementById('slide1'),
            document.getElementById('slide2'),
            document.getElementById('slide3')
        ];

        const bgLayer = document.getElementById('bg-layer');

        // High quality background images
        const backgrounds = [
            'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=1920&auto=format&fit=crop', // Orchard
            'https://plus.unsplash.com/premium_photo-1661962692059-55d5a4319814?q=80&w=1920&auto=format&fit=crop', // Drip
            'save water.jpeg'  // User provided image
        ];

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            if (slides[index]) slides[index].classList.add('active');

            if (backgrounds[index]) {
                bgLayer.style.backgroundImage = `url('${backgrounds[index]}')`;
            }
        }

        // Timeline
        setTimeout(() => showSlide(0), 100);
        setTimeout(() => showSlide(1), 3500);
        setTimeout(() => showSlide(2), 7000);
    </script>
</body>

</html>
